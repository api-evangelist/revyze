openapi: 3.1.0
info:
  title: Fast Admin Multiplayer API
  version: 0.1.0
tags:
- name: Multiplayer
paths:
  /multiplayer/devtools/copy:
    post:
      summary: Devtools Copy
      operationId: devtools_copy_multiplayer_devtools_copy_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevtoolsCopyRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Multiplayer
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    DevtoolsCopyRequest:
      properties:
        value:
          type: string
          title: Value
      type: object
      required:
      - value
      title: DevtoolsCopyRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
