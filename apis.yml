name: Revyze
description: >-
  Revyze is a French EdTech mobile learning application that helps secondary and
  baccalaureate-level students revise by scrolling short-form educational videos
  and playing quizzes created by a community of young content creators. The app
  covers all school subjects and is oriented around exam preparation for the French
  brevet and baccalaureate, reporting more than two million users, a 4.8/5 app-store
  rating, and 15,000+ videos, all offered free of charge. Revyze is a portfolio
  company of Speedinvest. This profile also captures the app's publicly reachable
  backend at api.revyze.fr — a FastAPI service that fronts a GraphQL API, an AI
  study-coach streaming endpoint, and subscription/content-moderation webhooks —
  discovered and harvested by the API Evangelist enrichment pipeline. It is the
  application's own backend rather than a documented public developer program.
